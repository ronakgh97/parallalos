[package]
name = "parallelos"
version = "1.2.0"
edition = "2024"
authors = ["ronakgh {ronakgh97@gmail.com}"]
description = "Thread pool for highly parallel computation"
license = "MIT"
repository = "https://github.com/ronakgh97/parallelos"
readme = "README.md"
categories = ["algorithms", "concurrency"]
keywords = ["scheduler", "thread-pool", "parallel-computation", "parallelism"]

[lib]
name = "parallelos"
path = "src/lib.rs"

[[bench]]
name = "bench"
path = "bench/bench.rs"
harness = false

[dependencies]
crossbeam = "0.8.5"
fastrand = "2.5.0"
anyhow = "1.0.104"

[dev-dependencies]
sha2 = "0.11.1"
hex = "0.4.3"
aes-gcm = "0.11.1"
zstd = "0.14.2"
# core_affinity = "0.8.3"
# plotters = "0.3.7"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
debug = false

[profile.dev]
opt-level = 1
incremental = true
debug = "full"
