[package]
name = "parallelos"
version = "1.0.0"
edition = "2024"

[lib]
name = "parallelos"
path = "src/lib.rs"

[dependencies]
crossbeam = "0.8.5"
fastrand = "2.5.0"
anyhow = "1.0.104"

[dev-dependencies]
sha2 = "0.11.0"
hex = "0.4.3"
# core_affinity = "0.8.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
incremental = false
debug = false

[profile.dev]
opt-level = 1
debug = true
incremental = true